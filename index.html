
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESCOLHAS</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #101116;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.container {
    padding: 30px;
}

h1 {
    font-size: 65px;
    letter-spacing: 8px;
    margin-bottom: 15px;
}

p {
    color: #aaa;
    margin-bottom: 35px;
}

button {
    background: #e0a526;
    border: none;
    padding: 16px 55px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #ffc64b;
    transform: scale(1.05);
}

</style>
</head>

<body>

<div class="container">
    <h1>ESCOLHAS</h1>
    <p>Suas decisões podem mudar tudo.</p>

    <button onclick="iniciarJogo()">JOGAR</button>
</div>

<script>
function iniciarJogo() {
    alert("Prepare-se. Sua história está começando...");
}
</script>

</body>
</html>
